<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background & Street Scene -->
  <rect width="600" height="400" fill="url(#skyGrad)" />
  <rect y="280" width="600" height="120" fill="#334155" />
  <line x1="0" y1="340" x2="600" y2="340" stroke="#f1f5f9" stroke-width="6" stroke-dasharray="25, 20" />
  <!-- School Fence & Sign -->
  <rect x="20" y="160" width="180" height="120" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="35" y="210" fill="#f87171" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">OAKRIDGE SCHOOL</text>
  <text x="35" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">PEDESTRIAN ZONE</text>
  <line x1="20" y1="280" x2="200" y2="280" stroke="#475569" stroke-width="8" />
  <!-- Utility Pole -->
  <rect x="420" y="40" width="28" height="340" fill="#475569" />
  <rect x="350" y="70" width="160" height="14" fill="#334155" />
  <!-- Transformer Box -->
  <rect x="390" y="84" width="80" height="90" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="2" />
  <text x="405" y="130" fill="#ef4444" font-family="monospace" font-weight="bold" font-size="10">DANGER 4.8kV</text>
  <!-- Hanging Broken Wire -->
  <path d="M 400 90 Q 320 220 260 270" stroke="#0f172a" stroke-width="7" fill="none" />
  <path d="M 400 90 Q 320 220 260 270" stroke="#fbbf24" stroke-width="3" fill="none" stroke-dasharray="8, 4" />
  <!-- Violent Spark & Arc Flash Burst -->
  <circle cx="260" cy="270" r="65" fill="url(#sparkGlow)" />
  <path d="M 260 270 L 230 240 L 245 255 L 210 230 L 235 265 L 195 275 L 240 285 L 220 315 L 255 290 L 270 330 L 275 290 L 310 310 L 285 275 L 325 255 L 280 260 Z" fill="#ffffff" />
  <path d="M 260 270 L 245 210 L 275 240 L 290 190 L 285 245 L 330 230 L 285 260 Z" fill="#38bdf8" />
  <!-- AI Hazard Bounding Box Overlay -->
  <rect x="180" y="190" width="170" height="140" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6, 4" />
  <rect x="180" y="170" width="190" height="22" fill="#ef4444" rx="3" />
  <text x="186" y="185" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="11">HAZARD: ARC FLASH 94%</text>
</svg>
