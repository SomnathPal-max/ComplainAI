  <path d="M 210 210 C 255 185, 385 195, 430 225 C 460 255, 440 335, 375 355 C 305 370, 195 345, 175 285 C 165 255, 195 225, 210 210 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
