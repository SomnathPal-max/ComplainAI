<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="holeDepth" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>
  <!-- Road Surface -->
  <rect width="600" height="400" fill="#475569" />
  <!-- Concrete Curb & Sidewalk -->
  <rect x="0" y="0" width="600" height="90" fill="#94a3b8" />
  <line x1="0" y1="90" x2="600" y2="90" stroke="#cbd5e1" stroke-width="6" />
  <!-- Bicycle Lane Green Stripe -->
  <rect x="0" y="96" width="600" height="60" fill="#065f46" opacity="0.85" />
  <line x1="0" y1="156" x2="600" y2="156" stroke="#ffffff" stroke-width="4" stroke-dasharray="15, 15" />
  <!-- Street Markings -->
  <text x="40" y="135" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="20" opacity="0.7">🚲 BIKE LANE</text>
  <!-- The Deep Pothole Crater -->
  <path d="M 220 220 C 260 190, 380 200, 420 230 C 450 260, 430 330, 370 350 C 310 365, 200 340, 180 290 C 170 260, 200 230, 220 220 Z" fill="url(#holeDepth)" stroke="#0f172a" stroke-width="4" />
  <!-- Exposed Jagged Rocks & Sub-base -->
  <polygon points="260,250 290,265 270,285" fill="#64748b" />
  <polygon points="340,240 370,255 350,275" fill="#64748b" />
  <polygon points="310,290 340,310 300,320" fill="#475569" />
  <polygon points="230,280 250,300 220,310" fill="#334155" />
  <!-- Cracks Radiating from Pothole -->
  <path d="M 180 290 L 130 320 L 100 310" stroke="#1e293b" stroke-width="3" fill="none" />
  <path d="M 420 230 L 480 220 L 520 240" stroke="#1e293b" stroke-width="3" fill="none" />
  <path d="M 370 350 L 390 380" stroke="#1e293b" stroke-width="3" fill="none" />
  <!-- AI Hazard Bounding Box Overlay -->
  <rect x="160" y="180" width="300" height="190" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6, 4" />
  <rect x="160" y="156" width="220" height="24" fill="#f59e0b" rx="3" />
  <text x="168" y="173" fill="#0f172a" font-family="monospace" font-weight="bold" font-size="12">DEFECT: ASPHALT VOID 64%</text>
</svg>
